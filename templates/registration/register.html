{% extends 'base.html' %}

{% block content %}
<section class="auth-card panel">
    <p class="eyebrow">{{ ui.account }}</p>
    <h1>{{ ui.register }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button primary" type="submit">{{ ui.create_account }}</button>
    </form>
    <p class="muted">{{ ui.have_account }} <a class="text-link" href="{% url 'cybershield:login' %}">{{ ui.login }}</a></p>
</section>
{% endblock %}
